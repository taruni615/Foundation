<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foundation Textbooks — Questions Viewer</title>
  <link rel="stylesheet" href="./lib/viewer.css" />
  <style>
    .qcard{background:rgba(2,6,23,.25);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
    .qcard.flagged{border-color:rgba(251,191,36,.45)}
    .qhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .qnum{font-weight:600;color:#bfdbfe;margin-left:2px}
    .passage{border-left:3px solid var(--accent);background:rgba(96,165,250,.07);
             border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:10px}
    .opts{list-style:none;padding-left:0;margin:8px 0 0}
    .opts li{margin:3px 0}
    .opts li.correct{font-weight:600}
    .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .filters select,.filters input[type=text]{min-width:150px}
    .facet{display:grid;gap:6px}
    .facet button{width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:rgba(2,6,23,.18)}
    .facet button.active{border-color:var(--accent);background:rgba(96,165,250,.12)}
    .facet .n{float:right;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card hero">
      <div class="row">
        <div>
          <h1 style="margin:0 0 6px" id="title">Questions Viewer</h1>
          <div class="muted" id="status">Loading…</div>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <input id="filePick" type="file" accept=".json,application/json" hidden />
          <button id="pickBtn" class="primary" type="button">Open JSON file…</button>
          <span id="pathControls" class="row">
            <label class="muted">or path</label>
            <input id="jsonPath" type="text" style="min-width:320px" />
            <button id="loadBtn" type="button">Load</button>
          </span>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="chip good" id="chipBook">book: —</span>
        <span class="chip" id="chipChapters">chapters: —</span>
        <span class="chip" id="chipTotal">questions: —</span>
        <span class="chip" id="chipAnswered">answered: —</span>
        <span class="chip" id="chipImages">with figures: —</span>
      </div>
      <div class="muted" style="margin-top:8px;line-height:1.45" id="hint"></div>
      <div id="dropZone" class="muted" style="margin-top:10px;padding:18px;border:1px dashed var(--border);border-radius:12px;text-align:center;display:none">
        Drop a <code class="path">&lt;book&gt;_questions.json</code> here, or use <b>Open JSON file…</b>
      </div>
    </div>

    <div id="mainGrid" class="grid" style="display:none">
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <select id="chapterSelect" style="flex:1;min-width:180px"></select>
        </div>
        <div id="chapterList" class="list"></div>
        <div style="margin-top:14px">
          <div class="label" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Section</div>
          <div id="sectionFacet" class="facet"></div>
        </div>
        <div style="margin-top:14px">
          <div class="label" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Question type</div>
          <div id="typeFacet" class="facet"></div>
        </div>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <h2 id="chapterHeading" style="margin:0">Chapter</h2>
          <div class="spacer"></div>
          <span id="matchChip" class="chip"></span>
        </div>
        <div class="filters">
          <input id="search" type="text" placeholder="Search question, answer, explanation…" style="flex:1;min-width:220px" />
          <select id="answerFilter">
            <option value="">Answer: any</option>
            <option value="yes">Has answer</option>
            <option value="no">Missing answer</option>
          </select>
          <select id="figureFilter">
            <option value="">Figures: any</option>
            <option value="yes">Has figure</option>
            <option value="no">No figure</option>
          </select>
          <select id="optionFilter">
            <option value="">Options: any</option>
            <option value="yes">Has options</option>
            <option value="no">No options</option>
          </select>
          <button id="resetBtn" type="button">Reset</button>
        </div>
        <div id="pagerTop" class="row pager" style="margin-bottom:10px"></div>
        <div id="results"></div>
        <div id="pagerBottom" class="row pager" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code", "img"],
        ignoreHtmlClass: "no-mathjax",
      },
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="./lib/content_render.js"></script>
  <script>
    var CR = window.ContentRender;
    var PAGE_SIZE = 25;

    var state = {
      doc: null,
      chapters: [],
      activeChapter: 0,
      imageMap: {},
      imageByUrl: {},
      section: "",
      qtype: "",
      search: "",
      hasAnswer: "",
      hasFigure: "",
      hasOptions: "",
      page: 0,
      jsonPath: "",
    };

    var els = {};
    ["title","status","hint","jsonPath","loadBtn","filePick","pickBtn","pathControls","dropZone",
     "chipBook","chipChapters","chipTotal",
     "chipAnswered","chipImages","mainGrid","chapterSelect","chapterList","sectionFacet",
     "typeFacet","chapterHeading","matchChip","search","answerFilter","figureFilter",
     "optionFilter","resetBtn","pagerTop","results","pagerBottom"].forEach(function(id) {
      els[id] = document.getElementById(id);
    });

    function getParam(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search || "");
      return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
    }

    function normalizeJsonPath(path) {
      var p = String(path || "").trim();
      if (p && !/^https?:\/\//i.test(p) && p[0] !== "/") p = "/" + p;
      return p;
    }

    function questionSection(q) {
      return (q && q.source && q.source.section) || "Other";
    }

    // Figures reach a question as {id, file, source_url}; the renderer wants one
    // id -> asset map for the chapter, plus a URL index for the raw CDN links
    // that exercise questions still carry in their text.
    function buildChapterImages(chapter) {
      var assets = {};
      (chapter.questions || []).forEach(function(q) {
        (q.images || []).forEach(function(img) {
          if (img && img.id && !assets[img.id]) assets[img.id] = img;
        });
      });
      state.imageMap = CR.buildImageMap(assets);
      state.imageByUrl = CR.buildImageUrlMap(state.imageMap);
    }

    function countBy(items, keyFn) {
      var counts = {};
      items.forEach(function(it) {
        var k = keyFn(it) || "—";
        counts[k] = (counts[k] || 0) + 1;
      });
      return counts;
    }

    function currentChapter() {
      return state.chapters[state.activeChapter] || { questions: [] };
    }

    function matches(q) {
      if (state.section && questionSection(q) !== state.section) return false;
      if (state.qtype && (q.question_type || "") !== state.qtype) return false;
      var answered = !!String(q.answer == null ? "" : q.answer).trim();
      if (state.hasAnswer === "yes" && !answered) return false;
      if (state.hasAnswer === "no" && answered) return false;
      var figured = !!(q.images && q.images.length);
      if (state.hasFigure === "yes" && !figured) return false;
      if (state.hasFigure === "no" && figured) return false;
      var opted = !!(q.options && (Array.isArray(q.options)
        ? q.options.length : Object.keys(q.options).length));
      if (state.hasOptions === "yes" && !opted) return false;
      if (state.hasOptions === "no" && opted) return false;
      if (state.search) {
        // Match the words the reader sees: a stem carrying MathML is mostly
        // markup, so searching the raw string hits tag names instead.
        var hay = CR.plainText([q.question_stem, q.question, q.answer, q.explanation]
          .join(" ")).toLowerCase();
        if (hay.indexOf(state.search.toLowerCase()) < 0) return false;
      }
      return true;
    }

    function filtered() {
      return (currentChapter().questions || []).filter(matches);
    }

    function renderQuestion(q) {
      var esc = CR.esc;
      var answer = String(q.answer == null ? "" : q.answer).trim();
      var hasOptions = q.options && (Array.isArray(q.options)
        ? q.options.length : Object.keys(q.options).length);
      var options = hasOptions
        ? CR.renderOptions(q.options, answer, state.imageMap, state.imageByUrl)
        : "";
      // Matching questions carry their two lists as fields of their own.
      var lists = CR.renderMatchingLists(q.list_1, q.list_2, state.imageMap, state.imageByUrl);
      // Only the letter-keyed option form is duplicated inside the stem.
      var stem = (options && !Array.isArray(q.options))
        ? CR.stripInlineOptions(q.question, q.options) : q.question;
      // With the choices listed and the key marked, repeating a bare "b" as the
      // answer adds nothing; the explanation is the useful half.
      var answerIsBareKey = options && !Array.isArray(q.options) &&
        /^\(?[a-e]\)?$/i.test(answer);

      var chips = [];
      if (q.question_type) chips.push('<span class="chip warn">' + esc(q.question_type) + "</span>");
      chips.push('<span class="chip">' + esc(questionSection(q)) + "</span>");
      if (q.images && q.images.length) chips.push('<span class="chip">' + q.images.length + " fig</span>");
      if (!answer) chips.push('<span class="chip warn">no answer</span>');
      var page = q.source && (q.source.printed_page_number || q.source.pdf_page_number);
      if (page) chips.push('<span class="chip">p.' + esc(page) + "</span>");
      // The exam the book credits the question to, lifted out of the stem by
      // the export so it reads as provenance rather than as part of the text.
      var exam = q.source && q.source.exam;
      if (exam && exam.length) {
        chips.push('<span class="chip">' + esc([].concat(exam).join(", ")) + "</span>");
      }

      var html = '<div class="qcard' + (answer ? "" : " flagged") + '">';
      html += '<div class="qhead">' + chips.join("") +
              '<span class="qnum">Q' + esc(q.question_number) + "</span></div>";
      // The shared passage a run of questions refers back to. Repeated on each
      // card rather than grouped, so a question still reads on its own once the
      // list is filtered or paged.
      if (q.question_stem) {
        html += '<div class="passage"><div class="label">Passage</div>' +
                CR.renderRichContent(q.question_stem, state.imageMap, state.imageByUrl) +
                "</div>";
      }
      html += CR.renderRichContent(stem, state.imageMap, state.imageByUrl);
      html += lists;
      html += options;
      if (answer && !answerIsBareKey) {
        html += '<div style="margin-top:10px"><div class="label">Answer</div>' +
                CR.renderRichContent(answer, state.imageMap, state.imageByUrl) + "</div>";
      }
      if (q.explanation) {
        html += '<div style="margin-top:10px"><div class="label">Explanation</div>' +
                CR.renderRichContent(q.explanation, state.imageMap, state.imageByUrl) + "</div>";
      }
      html += "</div>";
      return html;
    }

    function renderPager(total) {
      if (total <= PAGE_SIZE) return "";
      var from = state.page * PAGE_SIZE;
      return '<button type="button" data-page="prev"' + (from <= 0 ? " disabled" : "") + ">Prev</button>" +
        '<span class="muted">' + (from + 1) + "–" + Math.min(from + PAGE_SIZE, total) + " of " + total + "</span>" +
        '<button type="button" data-page="next"' + (from + PAGE_SIZE >= total ? " disabled" : "") + ">Next</button>";
    }

    function renderResults() {
      var items = filtered();
      var total = items.length;
      if (state.page * PAGE_SIZE >= total) state.page = 0;
      var slice = items.slice(state.page * PAGE_SIZE, state.page * PAGE_SIZE + PAGE_SIZE);

      var answered = items.filter(function(q) { return String(q.answer == null ? "" : q.answer).trim(); }).length;
      els.matchChip.textContent = total + " shown · " + answered + " answered";
      els.pagerTop.innerHTML = renderPager(total);
      els.pagerBottom.innerHTML = renderPager(total);
      els.results.innerHTML = slice.length
        ? slice.map(renderQuestion).join("")
        : '<div class="muted">No questions match these filters.</div>';

      [els.pagerTop, els.pagerBottom].forEach(function(bar) {
        Array.prototype.forEach.call(bar.querySelectorAll("button[data-page]"), function(btn) {
          btn.addEventListener("click", function() {
            state.page += (this.getAttribute("data-page") === "next" ? 1 : -1);
            if (state.page < 0) state.page = 0;
            renderResults();
            window.scrollTo(0, 0);
          });
        });
      });
      CR.typesetMath(els.results);
    }

    function renderFacet(el, counts, activeValue, onPick) {
      var keys = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; });
      var total = keys.reduce(function(sum, k) { return sum + counts[k]; }, 0);
      var html = ['<button type="button" data-value=""' + (activeValue ? "" : ' class="active"') +
                  '>All <span class="n">' + total + "</span></button>"];
      keys.forEach(function(k) {
        html.push('<button type="button" data-value="' + CR.escAttr(k) + '"' +
          (activeValue === k ? ' class="active"' : "") + ">" + CR.esc(k) +
          '<span class="n">' + counts[k] + "</span></button>");
      });
      el.innerHTML = html.join("");
      Array.prototype.forEach.call(el.querySelectorAll("button[data-value]"), function(btn) {
        btn.addEventListener("click", function() {
          onPick(this.getAttribute("data-value"));
          state.page = 0;
          renderFacets();
          renderResults();
        });
      });
    }

    function renderFacets() {
      var questions = currentChapter().questions || [];
      renderFacet(els.sectionFacet, countBy(questions, questionSection), state.section,
        function(v) { state.section = v; });
      // Type counts follow the chosen section, so the two facets stay coherent.
      var scoped = state.section
        ? questions.filter(function(q) { return questionSection(q) === state.section; })
        : questions;
      renderFacet(els.typeFacet, countBy(scoped, function(q) { return q.question_type; }), state.qtype,
        function(v) { state.qtype = v; });
    }

    function renderChapterNav() {
      els.chapterList.innerHTML = state.chapters.map(function(ch, i) {
        var qs = ch.questions || [];
        var answered = qs.filter(function(q) { return String(q.answer == null ? "" : q.answer).trim(); }).length;
        return '<button type="button" class="topicBtn' + (i === state.activeChapter ? " active" : "") +
          '" data-chapter="' + i + '">' + CR.esc(ch.chapter_number + ". " + (ch.chapter_name || "")) +
          '<span class="sub">' + qs.length + " questions · " + answered + " answered</span></button>";
      }).join("");
      Array.prototype.forEach.call(els.chapterList.querySelectorAll("button[data-chapter]"), function(btn) {
        btn.addEventListener("click", function() { showChapter(Number(this.getAttribute("data-chapter"))); });
      });
      els.chapterSelect.innerHTML = state.chapters.map(function(ch, i) {
        return '<option value="' + i + '"' + (i === state.activeChapter ? " selected" : "") + ">" +
          CR.esc(ch.chapter_number + ". " + (ch.chapter_name || "")) + "</option>";
      }).join("");
    }

    function showChapter(idx) {
      if (!(idx >= 0 && idx < state.chapters.length)) idx = 0;
      state.activeChapter = idx;
      state.page = 0;
      state.section = "";
      state.qtype = "";
      var ch = currentChapter();
      buildChapterImages(ch);
      els.chapterHeading.textContent = ch.chapter_number + ". " + (ch.chapter_name || "");
      renderChapterNav();
      renderFacets();
      renderResults();
    }

    function setMeta(doc) {
      var all = [];
      (doc.chapters || []).forEach(function(ch) { all = all.concat(ch.questions || []); });
      var answered = all.filter(function(q) { return String(q.answer == null ? "" : q.answer).trim(); }).length;
      var figured = all.filter(function(q) { return q.images && q.images.length; }).length;
      var who = [doc.class ? "class " + doc.class : "", doc.subject || ""].filter(Boolean).join(" · ");
      els.title.textContent = (doc.book_name || "Questions") + " — Questions Viewer";
      els.chipBook.textContent = "book: " + (who || doc.book_name || "—");
      els.chipChapters.textContent = "chapters: " + (doc.chapters || []).length;
      els.chipTotal.textContent = "questions: " + all.length;
      els.chipAnswered.textContent = "answered: " + answered +
        (all.length ? " (" + Math.round(100 * answered / all.length) + "%)" : "");
      els.chipImages.textContent = "with figures: " + figured;
    }

    // Validation and wiring shared by both sources, so a file picked from disk
    // behaves exactly like one fetched from the server.
    function applyDocument(doc, label) {
      if (!doc || !Array.isArray(doc.chapters)) {
        throw new Error("Not a questions document — expected chapters[].");
      }
      // A theory document has the same chapters[] spine, so check for the
      // payload this page actually renders rather than loading it empty.
      if (!doc.chapters.some(function(ch) { return Array.isArray(ch.questions); })) {
        throw new Error("This looks like a theory document (no questions[]). " +
                        "Open it in the theory viewer.");
      }
      state.doc = doc;
      state.chapters = doc.chapters;
      setMeta(doc);
      els.mainGrid.style.display = "";
      if (els.dropZone) els.dropZone.style.display = "none";
      var wanted = getParam("chapter");
      var idx = 0;
      for (var i = 0; i < state.chapters.length; i++) {
        if (String(state.chapters[i].chapter_number) === String(wanted)) { idx = i; break; }
      }
      showChapter(idx);
      els.status.textContent = "Loaded: " + label;
    }

    function showLoadError(err) {
      els.status.textContent = "Error: " + String((err && err.message) || err);
      els.mainGrid.style.display = "none";
      if (els.dropZone) els.dropZone.style.display = "";
    }

    // Reading a picked File needs no server, which is what makes this page work
    // when it is copied to another machine and opened straight from disk.
    function loadFile(file) {
      if (!file) return;
      els.status.textContent = "Reading " + file.name + " …";
      var reader = new FileReader();
      reader.onload = function () {
        try {
          applyDocument(JSON.parse(String(reader.result)), file.name);
        } catch (e) {
          showLoadError(e);
        }
      };
      reader.onerror = function () { showLoadError(new Error("could not read " + file.name)); };
      reader.readAsText(file);
    }

    function doLoad() {
      var p = (els.jsonPath.value || "").trim();
      if (!p) return;
      try { sessionStorage.setItem("questionsViewerPath", p); } catch (e) { /* private mode */ }
      state.jsonPath = normalizeJsonPath(p);
      els.status.textContent = "Loading " + p + " …";
      fetch(state.jsonPath, { cache: "no-store" }).then(function(resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status + " for " + p);
        return resp.json();
      }).then(function(doc) {
        applyDocument(doc, p);
      }).catch(showLoadError);
    }

    function init() {
      // Opened straight from disk there is no server to fetch a path from, so
      // the page asks for a file instead of trying and failing.
      var standalone = location.protocol === "file:";
      var saved = "";
      try { saved = sessionStorage.getItem("questionsViewerPath") || ""; } catch (e) { /* private mode */ }
      els.jsonPath.value = getParam("json") || saved ||
        "edu_pipeline/workspace/10 PHYSICS FOUNDATION/10 PHYSICS FOUNDATION_questions.json";
      els.hint.innerHTML = standalone
        ? "Pick a <code class='path'>&lt;book&gt;_questions.json</code> to view it. " +
          "Everything runs in this page — nothing is uploaded."
        : "Reads <code class='path'>&lt;book&gt;_questions.json</code>. Theory lives in the " +
          "<a href='./theory_viewer.html'>theory viewer</a>; a whole " +
          "<code class='path'>*_final.json</code> opens in " +
          "<a href='./output_json_viewer.html'>output_json_viewer.html</a>.<br>" +
          "Params: <code class='path'>?json=…</code>, <code class='path'>&amp;chapter=3</code>";

      if (standalone) {
        if (els.pathControls) els.pathControls.style.display = "none";
        if (els.dropZone) els.dropZone.style.display = "";
        els.status.textContent = "No file loaded yet.";
      }

      if (els.pickBtn && els.filePick) {
        els.pickBtn.addEventListener("click", function () { els.filePick.click(); });
        els.filePick.addEventListener("change", function (e) {
          loadFile(e.target.files && e.target.files[0]);
        });
      }
      ["dragenter", "dragover"].forEach(function (name) {
        document.addEventListener(name, function (e) { e.preventDefault(); });
      });
      document.addEventListener("drop", function (e) {
        e.preventDefault();
        loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
      });

      els.loadBtn.addEventListener("click", doLoad);
      els.jsonPath.addEventListener("keydown", function(e) { if (e.key === "Enter") doLoad(); });
      els.chapterSelect.addEventListener("change", function(e) { showChapter(Number(e.target.value)); });
      els.search.addEventListener("input", function(e) {
        state.search = e.target.value || "";
        state.page = 0;
        renderResults();
      });
      [["answerFilter", "hasAnswer"], ["figureFilter", "hasFigure"], ["optionFilter", "hasOptions"]]
        .forEach(function(pair) {
          els[pair[0]].addEventListener("change", function(e) {
            state[pair[1]] = e.target.value;
            state.page = 0;
            renderResults();
          });
        });
      els.resetBtn.addEventListener("click", function() {
        state.search = state.hasAnswer = state.hasFigure = state.hasOptions = "";
        state.section = state.qtype = "";
        state.page = 0;
        els.search.value = "";
        els.answerFilter.value = els.figureFilter.value = els.optionFilter.value = "";
        renderFacets();
        renderResults();
      });

      if (!standalone) doLoad();
    }

    init();
  </script>
</body>
</html>
